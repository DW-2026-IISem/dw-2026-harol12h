<main class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-lg sm:p-9">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-900 text-white">
        <i class="pi pi-shop text-2xl"></i>
      </div>

      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">
        Comercio de prendas
      </p>

      <h1 class="mt-2 text-3xl font-bold text-slate-900">
        TramaModa
      </h1>

      <p class="mt-2 text-sm text-slate-600">
        Inicia sesión para acceder al sistema.
      </p>
    </div>

    <form class="space-y-5" (ngSubmit)="submit()">
      <div>
        <label for="username" class="mb-2 block text-sm font-medium text-slate-700">
          Usuario
        </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          required
          [disabled]="loading()"
          placeholder="Ingresa tu usuario"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-600 focus:ring-2 focus:ring-slate-200 disabled:bg-slate-100"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          [disabled]="loading()"
          placeholder="Ingresa tu contraseña"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-600 focus:ring-2 focus:ring-slate-200 disabled:bg-slate-100"
        />
      </div>

      @if (errorMessage()) {
        <p role="alert" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-slate-900 px-4 py-3 font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="mt-7 text-center text-xs text-slate-500">
      Acceso para usuarios autorizados de TramaModa.
    </p>
  </section>
</main>
