<main class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <p-card class="w-full max-w-lg">
    <div class="text-center">
      <i class="pi pi-lock text-4xl text-slate-500" aria-hidden="true"></i>
      <h1 class="mt-4 text-2xl font-bold text-slate-900">Acceso denegado</h1>
      <p class="mt-2 text-slate-600">
        Tu sesión no tiene acceso a este recurso. Si crees que es un error,
        contacta con el administrador.
      </p>
      @if (permission(); as requiredPermission) {
        <div
          class="mt-4 rounded-lg bg-slate-100 px-4 py-3 text-left"
          aria-live="polite"
        >
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
            Permiso requerido
          </p>
          <p class="mt-1 break-all font-mono text-sm text-slate-800">
            {{ requiredPermission }}
          </p>
        </div>
      }
      <a
        pButton
        routerLink="/dashboard"
        class="mt-6"
        label="Volver al inicio"
      ></a>
    </div>
  </p-card>
</main>
