<p-toast />
<p-confirmdialog />

<p-card>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Colecciones</h1>
      <p class="mt-1 text-sm text-slate-500">
        Administra las colecciones comerciales de TramaModa.
      </p>
    </div>

    <p-button
      *appHasPermission="'POST /api/colecciones'"
      label="Nueva colección"
      icon="pi pi-plus"
      (onClick)="openCreate()"
    />
  </div>

  <div class="mb-4">
    <input
      pInputText
      type="text"
      placeholder="Buscar por nombre o descripción..."
      aria-label="Buscar colecciones"
      class="w-full"
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    />
  </div>

  @if (error()) {
    <div
      class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
      role="alert"
    >
      {{ error() }}
    </div>
  }

  <p-table
    [value]="filteredCollections()"
    [loading]="loading()"
    [tableStyle]="{ 'min-width': '40rem' }"
    [rowHover]="true"
    dataKey="id"
    responsiveLayout="scroll"
    emptyMessage="No hay colecciones para mostrar."
  >
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-collection>
      <tr>
        <td>{{ collection.id }}</td>
        <td class="font-medium">{{ collection.nombre }}</td>
        <td>{{ collection.descripcion || 'Sin descripción' }}</td>
        <td>
          <span
            class="rounded-full px-3 py-1 text-xs font-semibold"
            [class.bg-green-100]="collection.is_active"
            [class.text-green-700]="collection.is_active"
          >
            {{ collection.is_active ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
        <td>
          <div class="flex justify-end gap-2">
            <p-button
              *appHasPermission="'PUT /api/colecciones/:id'"
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              ariaLabel="Editar colección"
              (onClick)="openEdit(collection)"
            />
            <p-button
              *appHasPermission="'PATCH /api/colecciones/:id/deactivate'"
              icon="pi pi-ban"
              severity="danger"
              [text]="true"
              ariaLabel="Desactivar colección"
              [disabled]="!collection.is_active"
              (onClick)="deactivate(collection)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [header]="selectedCollection() ? 'Editar colección' : 'Nueva colección'"
  [visible]="dialogVisible()"
  (visibleChange)="!$event && closeDialog()"
  [modal]="true"
  [closable]="!saving()"
  [style]="{ width: 'min(95vw, 36rem)' }"
>
  <app-collection-form
    [collection]="selectedCollection()"
    [saving]="saving()"
    (save)="saveCollection($event)"
    (cancel)="closeDialog()"
  />
</p-dialog>
