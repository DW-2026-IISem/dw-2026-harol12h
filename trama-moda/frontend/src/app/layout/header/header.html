<header
  class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white px-4 sm:px-6"
>
  <button
    pButton
    type="button"
    text
    rounded
    aria-label="Mostrar u ocultar el menú"
    (click)="menuRequested.emit()"
  >
    <i pButtonIcon class="pi pi-bars"></i>
  </button>

  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-semibold text-slate-900">
      {{ appName() }}
    </p>
    <p class="truncate text-xs text-slate-500">
      Gestión de prendas, inventario, clientes y ventas
    </p>
  </div>

  @if (userName()) {
    <div class="hidden min-w-0 text-right sm:block">
      <p class="truncate text-sm font-medium text-slate-800">
        {{ userName() }}
      </p>
      @if (userEmail()) {
        <p class="truncate text-xs text-slate-500">{{ userEmail() }}</p>
      }
    </div>
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-200 text-sm font-semibold text-slate-700"
      aria-label="Iniciales del usuario"
    >
      {{ initials() }}
    </span>
    <button
      pButton
      type="button"
      text
      rounded
      title="Actualizar permisos"
      aria-label="Actualizar permisos"
      [loading]="refreshingPermissions()"
      (click)="refreshPermissionsRequested.emit()"
    >
      <i pButtonIcon class="pi pi-refresh"></i>
    </button>
    <button
      pButton
      type="button"
      text
      rounded
      aria-label="Abrir perfil"
      (click)="profileRequested.emit()"
    >
      <i pButtonIcon class="pi pi-user"></i>
    </button>
    <button
      pButton
      type="button"
      text
      rounded
      aria-label="Cerrar sesión"
      (click)="logoutRequested.emit()"
    >
      <i pButtonIcon class="pi pi-sign-out"></i>
    </button>
  }
</header>
